name: Docker V2 Validation

on:
  push:
    branches:
      - php-v2-development
  pull_request:
    branches:
      - php-v2-development

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Compose
        run: docker compose config >/tmp/totem-compose.yml

      - name: Build image
        run: docker compose build --pull

      - name: Start stack
        env:
          TOTEM_HTTP_PORT: 18080
          TOTEM_ADMIN_PASSWORD: 251933
        run: docker compose up -d

      - name: Wait for healthy container
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect --format='{{.State.Health.Status}}' totem-autoatendimento-v2 2>/dev/null || true)
            echo "health=$status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose logs --no-color
              exit 1
            fi
            sleep 3
          done
          docker compose logs --no-color
          exit 1

      - name: Validate HTTP health endpoint
        run: |
          curl -fsS http://127.0.0.1:18080/api.php?action=health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

      - name: Validate PHP extensions and OCR
        run: |
          docker compose exec -T app php -r 'foreach(["pdo_sqlite","mbstring","fileinfo","openssl"] as $e){if(!extension_loaded($e)){fwrite(STDERR,"missing:$e\n");exit(1);} echo "ok:$e\n";}'
          docker compose exec -T app sh -lc 'tesseract --list-langs 2>/dev/null | grep -qx por'
          docker compose exec -T app sh -lc 'tesseract --list-langs 2>/dev/null | grep -qx eng'
          docker compose exec -T app sh -lc 'command -v pdftoppm'
          docker compose exec -T app apache2ctl -t

      - name: Validate SQLite persistence
        run: |
          curl -fsS http://127.0.0.1:18080/api.php?action=health >/dev/null
          docker compose exec -T app test -s /var/www/html/data/totem.sqlite
          before=$(docker compose exec -T app sha256sum /var/www/html/data/totem.sqlite | awk '{print $1}')
          docker compose down
          TOTEM_HTTP_PORT=18080 docker compose up -d
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' totem-autoatendimento-v2 2>/dev/null || true)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          after=$(docker compose exec -T app sha256sum /var/www/html/data/totem.sqlite | awk '{print $1}')
          test "$before" = "$after"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
